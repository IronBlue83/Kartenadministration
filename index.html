function tickets(){return heading('Von der Zuteilung ins Stadion','Vergabe, Abruf, Weitergabe und spätere Nutzung je Karte.')+`<div class="card pad"><label class="inline-label">Spiel auswählen<select id="gameSelect" style="margin-top:9px">${db.games.map(g=>`<option value="${g.id}" ${selected===g.id?'selected':''}>${g.day}. Spieltag · ${esc(g.opponent)} · ${g.kind} · ${g.quota} Karten</option>`).join('')}</select></label></div>`+ticketSection(game());}
function members(){return heading('Unsere Mitglieder','Stammdaten bearbeiten und für die Kartenvergabe verwenden.','<button data-act="exportMembers">↓ Mitglieder exportieren</button><button class="primary" data-member="new">+ Mitglied</button>')+`<section class="card"><div class="cardhead"><h2>${db.members.length} Fanclubmitglieder</h2>${badge('Fiktive Stammdaten','blue')}</div>${table(['Mitglied','Kontakt','S04-Mitgliedsnummer','Regelzustimmung',''],db.members.map(m=>`<tr><td><span class="avatar">${esc(m.first[0]+m.last[0])}</span><strong>${esc(full(m))}</strong></td><td>${esc(m.email||'Keine E-Mail')}<small>${esc(m.mobile||m.phone||'Keine Telefonnummer')}</small></td><td>${esc(m.s04||'Nicht hinterlegt')}</td><td>${badge(m.consent?'Bestätigt':'Nicht erfasst',m.consent?'green':'gray')}</td><td><button class="link" data-member="${m.id}">Bearbeiten</button></td></tr>`))}</section>`;}
function district(){const year=new Date().getFullYear();const rows=[year-1,year,year+1].map(y=>{const n=db.meetings.filter(m=>m.year===y&&m.attended).length,done=db.reviewedYears.includes(y);return `<tr><td>${y}</td><td>${n}</td><td>${badge(n?'Berechtigt':done?'Ausgeschlossen':'Noch nicht feststellbar',n?'green':done?'amber':'gray')}</td><td>${y+1}</td><td><button class="link" data-year="${y}">${done?'Jahresprüfung öffnen':'Jahr abschließen'}</button></td></tr>`});return heading('Bezirk 23 & Teilnahme','Versammlungen dokumentieren und die Berechtigung im Folgejahr nachvollziehen.',`<button data-act="club">Fanclub bearbeiten</button>`)+`<div class="grid2"><section class="card pad"><h3>${esc(db.club.name)}</h3><p>Dachverbandsnummer <b>${esc(db.club.association)}</b><br>Debitorennummer Schalke 04 <b>${esc(db.club.debtor||'Noch nicht hinterlegt')}</b><br>Bezirk <b>${esc(db.club.district)}</b></p></section><section class="card pad"><h3>Teilnahmeregel</h3><p>Mindestens eine Teilnahme im Kalenderjahr berechtigt zur Verteilung im Folgejahr. Ein vollständig geprüftes Jahr ohne Teilnahme führt zum Ausschluss.</p></section></div><section class="card"><div class="cardhead"><h2>Jahresübersicht</h2></div>${table(['Jahr','Teilnahmen','Status im Folgejahr','Gültig für',''],rows)}</section><section class="card"><div class="cardhead"><h2>Bezirksversammlungen</h2><button class="primary" data-meeting="new">+ Teilnahme erfassen</button></div>${table(['Datum','Versammlung','Teilgenommen',''],db.meetings.map(m=>`<tr><td>${date(m.date)}</td><td>${esc(m.name)}</td><td>${badge(m.attended?'Ja':'Nein',m.attended?'green':'gray')}</td><td><button class="link" data-meeting="${m.id}">Bearbeiten</button></td></tr>`))}</section><div class="notice">Es wurden keine Versammlungsteilnahmen mitgeliefert. Fehlende Daten sind kein automatischer Ausschluss. Der erste Prototyp verwaltet einen Fanclub; die Dachverbandsnummer ermöglicht eine spätere Erweiterung.</div>`;}
function dataView(){return heading('Daten, die mitkommen','Fiktive Mitgliederdaten, Exporte und Sicherung des Demo-Arbeitsstands.')+`<div class="grid2"><section class="card pad"><h3>Demodaten geladen</h3><p>Mitgliederliste: 18 Mitglieder<br>Spielpaarungen: 34 Saisonspiele<br>Bestellung + Zuteilung: 173 Wünsche / 51 Karten</p><p>Importstand: 05.10.2026. Mitglieder und individuelle Wünsche wurden durch synthetische Beispieldaten ersetzt. Spielkontingente und Wunsch-Gesamtsummen dienen als Vorlage. Spieltermine sind Angaben der Vorlage.</p><button data-act="preview">Importvorschau ansehen</button></section><section class="card pad"><h3>Arbeitsstand sichern</h3><p>Änderungen werden nur in diesem Browser gespeichert. Eine Datensicherung enthält Mitglieder, Wünsche, Karten, Weitergaben und Protokoll.</p><div class="actions"><button class="primary" data-act="backup">Sicherung exportieren</button><button data-act="restore">Sicherung laden</button></div></section><section class="card pad"><h3>Für die weitere Bearbeitung</h3><p>CSV-Dateien lassen sich in Excel öffnen.</p><div class="actions"><button data-act="exportMembers">Mitglieder CSV</button><button data-act="exportSeason">Saison CSV</button><button data-act="exportTickets">Einzelkarten CSV</button><button data-act="exportRequests">Wünsche CSV</button></div></section><section class="card pad"><h3>Stand dieses Prototyps</h3><p>Keine Benutzerrollen oder gemeinsame Datenbank. Regelzustimmungen werden manuell dokumentiert. E-Mail-Versand und Kartenabruf bei Schalke erfolgen außerhalb der Anwendung. Weitere Excel-/CSV-Importe sind als Vorschau abgebildet.</p></section></div><section class="card"><div class="cardhead"><h2>Änderungsprotokoll</h2>${badge(db.history.length+' Einträge')}</div><div class="pad">${db.history.slice(0,100).map(h=>`<div class="history">${esc(h.text)}<br><small>${new Date(h.date).toLocaleString('de-DE')}</small></div>`).join('')||'<p>Noch keine Änderungen. Die Ausgangsdaten sind bereit.</p>'}</div></section>`;}
function render(){if(!game())selected=db.games[0].id;$('#nav').innerHTML=pages.map(([id,icon,label])=>`<button data-nav="${id}" class="${view===id||view==='detail'&&id==='season'?'active':''}"><span class="symbol">${icon}</span>${label}</button>`).join('');$('#crumb').textContent=view==='detail'?'Spieldetails':pages.find(p=>p[0]===view)?.[2]||'';$('#app').innerHTML='<div class="notice warn"><strong>DEMOVERSION · Fiktive Mitgliederdaten</strong><br>Mitglied 1–18, Kontaktdaten und persönliche Wünsche sind erfunden. Bitte keine echten personenbezogenen Daten eintragen. Änderungen bleiben in diesem Browser.</div>'+(storageError?'<div class="notice warn">Browserspeicher nicht verfügbar. Änderungen bitte als Datensicherung exportieren.</div>':'')+({season,allocation:allocations,detail,tickets,members,district,data:dataView}[view]());}
function editMember(id){const m=id==='new'?{id:crypto.randomUUID(),first:'',last:'',consent:false}:member(id);openDialog(id==='new'?'Mitglied hinzufügen':full(m),field('Vorname','first',m.first,'text','required')+field('Nachname','last',m.last,'text','required')+field('Geburtsdatum','birth',m.birth,'date')+field('Eintrittsdatum / Angabe','joined',m.joined)+field('Telefon','phone',m.phone)+field('Mobil','mobile',m.mobile)+field('E-Mail','email',m.email,'email')+field('S04-Mitgliedsnummer','s04',m.s04)+`<div class="full">${field('Adresse','address',m.address)}</div>`+check('Zustimmung zu den Auswärtskartenregeln liegt vor','consent',m.consent),f=>{const next={...m,...Object.fromEntries(f),consent:f.has('consent')};next.first=next.first.trim();next.last=next.last.trim();if(!next.first||!next.last)throw Error('Vor- und Nachname dürfen nicht leer sein.');if(id==='new')db.members.push(next);else Object.assign(m,next);save('Mitglied bearbeitet: '+full(next));});}
function editQuota(id){const g=db.games.find(g=>g.id===id);openDialog('Bezirkszuteilung bearbeiten',`<p class="full">${esc(g.opponent)} · ${g.kind}. Stehplätze sind in der Gesamtzahl enthalten.</p>`+field('Gesamtzuteilung','quota',g.quota,'number','min="0" required')+field('Davon Stehplätze (leer = offen)','standing',g.standing??'','number','min="0"'),f=>{const q=integer(f.get('quota'),'Gesamtzuteilung'),s=f.get('standing')===''?null:integer(f.get('standing'),'Stehplätze');if(s!==null&&s>q)throw Error('Stehplätze dürfen die Gesamtzuteilung nicht überschreiten.');if(q<g.tickets.length)throw Error('Die Gesamtzuteilung ist kleiner als die bereits vergebenen Karten.');if(s!==null&&(g.tickets.filter(t=>t.place==='Stehplatz').length>s||g.tickets.filter(t=>t.place==='Sitzplatz').length>q-s))throw Error('Die Aufteilung widerspricht bereits vergebenen Platzarten.');g.quota=q;g.standing=s;save('Zuteilung geändert: '+g.opponent+' ('+q+' Karten)');});}
function editDate(id){const g=db.games.find(g=>g.id===id);openDialog('Spieltermin bearbeiten',field('Datum','date',g.date,'date','required')+field('Anstoß (leer = offen)','time',g.time,'time'),f=>{g.date=f.get('date');g.time=f.get('time');save('Spieltermin geändert: '+g.opponent);});}
function editRequest(id){const g=game(),r=id==='new'?{id:crypto.randomUUID(),name:'',member:'',qty:1,cancelled:false,preseason:false}:g.requests.find(r=>r.id===id);openDialog('Kartenwunsch bearbeiten',field('Besteller / Gruppenname','name',r.name,'text','required')+select('Mitglied / Ansprechpartner','member',[['','Nicht zugeordnet'],...db.members.map(m=>[m.id,full(m)])],r.member)+field('Gewünschte Karten','qty',r.qty,'number','min="1" required')+check('Vor der Saison angefragt','preseason',r.preseason)+check('Bestellung storniert','cancelled',r.cancelled),f=>{const qty=integer(f.get('qty'),'Kartenanzahl');if(qty<1)throw Error('Mindestens eine Karte angeben.');const next={...r,name:f.get('name').trim(),member:f.get('member'),qty,cancelled:f.has('cancelled'),preseason:f.has('preseason')};if(!next.name)throw Error('Bitte einen Namen angeben.');if(id==='new')g.requests.push(next);else Object.assign(r,next);save('Wunsch geändert: '+next.name+' / '+g.opponent);});}
function addTicket(g,mid,reason,place){eligible(g,member(mid));if(g.tickets.length>=g.quota)throw Error('Das zugeteilte Kontingent ist bereits vollständig vergeben.');if(g.standing!==null&&place!=='Noch offen'){const max=place==='Stehplatz'?g.standing:g.quota-g.standing;if(g.tickets.filter(t=>t.place===place).length>=max)throw Error('Das Kontingent dieser Platzart ist ausgeschöpft.');}const t={id:crypto.randomUUID(),member:mid,reason,place,used:null,control:false,paid:false,retrieved:false,personalized:false,transfers:[]};g.tickets.push(t);return t;}
function assign(){const g=game();openDialog('Eine Karte vergeben',select('Mitglied','member',db.members.map(m=>[m.id,full(m)]),'')+select('Entscheidungsgrund','reason',['Nach Absprache','Nach Auslosung','Nach Kartenwunsch'].map(x=>[x,x]),'Nach Absprache')+select('Platzart','place',['Noch offen','Stehplatz','Sitzplatz'].map(x=>[x,x]),'Noch offen')+`<p class="full">${g.quota-g.tickets.length} Karte(n) verfügbar. Alle Fanclubmitglieder stehen in jeder Kategorie zur Auswahl.${g.kind==='Auswärts'?' S04-Mitgliedschaft und Regelzustimmung werden geprüft.':''}</p>`,f=>{const t=addTicket(g,f.get('member'),f.get('reason'),f.get('place'));save('Karte vergeben: '+full(member(t.member))+' / '+g.opponent+' / '+t.reason);});}
function lottery(){const g=game();const candidates=db.members.map(m=>{const req=g.requests.filter(r=>!r.cancelled&&r.preseason&&r.member===m.id),requested=sum(req,r=>r.qty),have=g.tickets.filter(t=>t.member===m.id).length;return {m,left:Math.max(0,requested-have),group:req.some(r=>r.name.includes('+'))};}).filter(c=>c.left>0&&(g.kind!=='Auswärts'||c.m.s04.trim()&&c.m.consent));openDialog('Live-Auslosung · eine Karte',`<p class="full">Gleiche Gewinnchance pro ausgewähltem Mitglied. Berücksichtigt werden aktive Saisonwünsche mit verbleibendem Bedarf${g.kind==='Auswärts'?', S04-Mitgliedsnummer und Regelzustimmung':''}. Bestellgruppen müssen vorher auf einzelne Personen aufgeteilt werden.</p>${candidates.filter(c=>!c.group).map(c=>check(full(c.m)+' · noch '+c.left+' gewünscht','candidate-'+c.m.id,true)).join('')||'<p class="full">Keine geeigneten Einzelwünsche vorhanden. Bitte Wünsche zuordnen und gegebenenfalls Regelzustimmungen erfassen.</p>'}<p class="full">Mit „Speichern“ wird genau eine Karte verbindlich ausgelost und das Ergebnis protokolliert. Vorher kann die Bestellung storniert werden.</p>`,f=>{const pool=candidates.filter(c=>!c.group&&f.has('candidate-'+c.m.id));if(!pool.length)throw Error('Bitte mindestens ein geeignetes Mitglied auswählen.');if(g.tickets.length>=g.quota)throw Error('Keine Karte mehr verfügbar.');const n=pool.length,limit=Math.floor(4294967296/n)*n;let v;do{v=crypto.getRandomValues(new Uint32Array(1))[0];}while(v>=limit);const winner=pool[v%n].m;addTicket(g,winner.id,'Nach Auslosung','Noch offen');save('Auslosung '+g.opponent+': '+full(winner)+' gewinnt. Teilnehmer: '+pool.map(c=>full(c.m)).join(', '));toast('Ausgelost: '+full(winner));});}
function editTicket(id){const g=game(),t=g.tickets.find(t=>t.id===id);openDialog('Kartenstatus · '+full(member(t.member)),select('Nutzung nach dem Spiel','used',[['','Noch offen'],['yes','Genutzt'],['no','Nicht genutzt']],t.used===null?'':t.used?'yes':'no')+select('Platzart','place',['Noch offen','Stehplatz','Sitzplatz'].map(x=>[x,x]),t.place)+check('Karte bei Schalke online abgerufen','retrieved',t.retrieved)+check('Karte bezahlt','paid',t.paid)+(g.kind==='Auswärts'?check('Karte auf das Mitglied personalisiert','personalized',t.personalized)+check('Personalisierung / Kartenkontrolle vor Ort durchgeführt','control',t.control):'')+(t.transfers.length?'<div class="full"><h3>Weitergaben</h3>'+t.transfers.map(h=>`<p>${date(h.date.slice(0,10))}: ${esc(full(member(h.from)))} → ${esc(full(member(h.to)))}<br>${esc(h.note)}</p>`).join('')+'</div>':''),f=>{const place=f.get('place');if(g.standing!==null&&place!=='Noch offen'){const count=g.tickets.filter(x=>x.id!==t.id&&x.place===place).length,max=place==='Stehplatz'?g.standing:g.quota-g.standing;if(count>=max)throw Error('Das Kontingent dieser Platzart ist ausgeschöpft.');}t.place=place;t.used=f.get('used')===''?null:f.get('used')==='yes';for(const k of ['retrieved','paid','personalized','control'])t[k]=f.has(k);save('Kartenstatus geändert: '+full(member(t.member))+' / '+g.opponent);});}
function transfer(id){const g=game(),t=g.tickets.find(t=>t.id===id);openDialog('Karte weitergeben',select('Neuer Karteninhaber','member',db.members.filter(m=>m.id!==t.member).map(m=>[m.id,full(m)]),'')+field('Absprache / Hinweis','note','','text','required')+'<p class="full">Die Weitergabe wird protokolliert. Nutzung, Personalisierung und Vor-Ort-Kontrolle werden für den neuen Inhaber zurückgesetzt; Zahlungsstatus bleibt erhalten.</p>',f=>{const to=f.get('member');eligible(g,member(to));t.transfers.push({from:t.member,to,date:new Date().toISOString(),note:f.get('note')});const before=full(member(t.member));t.member=to;t.personalized=false;t.control=false;t.used=null;save('Weitergabe '+g.opponent+': '+before+' → '+full(member(to)));});}
function meeting(id){const m=id==='new'?{id:crypto.randomUUID(),name:'Bezirksversammlung',date:new Date().toISOString().slice(0,10),attended:true}:db.meetings.find(m=>m.id===id);openDialog('Versammlungsteilnahme',field('Datum','date',m.date,'date','required')+field('Versammlung','name',m.name,'text','required')+check('Fanclub hat teilgenommen','attended',m.attended),f=>{const next={...m,date:f.get('date'),year:Number(f.get('date').slice(0,4)),name:f.get('name'),attended:f.has('attended')};if(id==='new')db.meetings.push(next);else Object.assign(m,next);save('Versammlung dokumentiert: '+next.date);});}

const actions={assign,lottery,backup,exportMembers:()=>csv('IronBlue-Mitglieder.csv',[['Vorname','Nachname','Geburtsdatum','Telefon','Mobil','Adresse','S04-Mitgliedsnummer','E-Mail','Eintrittsdatum','Regelzustimmung'],...db.members.map(m=>[m.first,m.last,m.birth,m.phone,m.mobile,m.address,m.s04,m.email,m.joined,m.consent?'Ja':'Nicht erfasst'])]),exportSeason:()=>csv('IronBlue-Saison.csv',[['Spieltag','Heim/Auswärts','Gegner','Datum','Anstoß','Wünsche','Zuteilung','Stehplätze','Sitzplätze','Intern vergeben'],...db.games.map(g=>[g.day,g.kind,g.opponent,g.date,g.time,demand(g),g.quota,g.standing??'',g.standing===null?'':g.quota-g.standing,assigned(g)])]),exportTickets:()=>csv('IronBlue-Einzelkarten.csv',[['Karten-ID','Spieltag','Gegner','Heim/Auswärts','Mitglied','Grund','Platzart','Bezahlt','Abgerufen','Personalisiert','Genutzt','Kontrolliert','Weitergaben'],...db.games.flatMap(g=>g.tickets.map(t=>[t.id,g.day,g.opponent,g.kind,full(member(t.member)),t.reason,t.place,t.paid,t.retrieved,g.kind==='Auswärts'?t.personalized:'Nicht erforderlich',t.used===null?'Offen':t.used,g.kind==='Auswärts'?t.control:'Nicht erforderlich',t.transfers.map(x=>full(member(x.from))+' → '+full(member(x.to))+' '+x.date).join(' | ')]))]),exportRequests:()=>csv('IronBlue-Wuensche.csv',[['Spieltag','Gegner','Art','Besteller','Mitglied','Menge','Vor Saison','Storniert'],...db.games.flatMap(g=>g.requests.map(r=>[g.day,g.opponent,g.kind,r.name,full(member(r.member)),r.qty,r.preseason,r.cancelled]))]),club:()=>openDialog('Fanclub-Stammdaten',field('Fanclubname','name',db.club.name,'text','required')+field('Dachverbandsnummer','association',db.club.association,'text','required')+field('Debitorennummer Schalke 04','debtor',db.club.debtor)+field('Bezirk','district',db.club.district),f=>{Object.assign(db.club,Object.fromEntries(f));save('Fanclub-Stammdaten geändert');}),preview:()=>openDialog('Importvorschau der Ausgangsdaten',`<p class="full">Die Demodaten sind bereits geladen. Ein erneuter Excel-Import ist in diesem Prototyp noch nicht verfügbar.</p><div class="full">${table(['Quelle','Datensätze'],['<tr><td>Mitgliederliste.xlsx</td><td>18 Mitglieder</td></tr>','<tr><td>Spielpaarungen.xlsx</td><td>34 Spiele</td></tr>','<tr><td>Bestellung + Zuteilung.xlsx</td><td>34 Spielzeilen</td></tr>'])}</div><p class="full">Zuordnung über Spieltag und Heim/Auswärts. 106 Heimwünsche / 39 Heimkarten; 67 Auswärtswünsche / 12 Auswärtskarten. Alle Wünsche sind fiktiven Mitgliedern zugeordnet. Versammlungsteilnahmen wurden nicht mitgeliefert.</p>`,()=>{}),restore:()=>{const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const next=JSON.parse(await input.files[0].text());validateBackup(next);openDialog('Datensicherung wiederherstellen',`<p class="full">${next.members.length} Mitglieder und ${next.games.length} Spiele werden geladen. Der aktuelle Browserstand wird ersetzt. Bitte diesen bei Bedarf vorher exportieren.</p>`,()=>{db=next;selected=db.games[0].id;save('Datensicherung wiederhergestellt');});}catch(e){toast('Sicherung ungültig: '+e.message);}};input.click();}};
function validateBackup(x){if(x.demo!==true)throw Error('Nur Sicherungen der Demoversion können hier geladen werden.');if(x.version!==1||!x.club||!Array.isArray(x.members)||!Array.isArray(x.games)||!x.games.length||!Array.isArray(x.history)||!Array.isArray(x.meetings)||!Array.isArray(x.reviewedYears))throw Error('Unbekanntes Format');const ids=new Set();for(const m of x.members){if(typeof m.id!=='string'||ids.has(m.id))throw Error('Mitglieds-ID ungültig');ids.add(m.id);for(const k of ['first','last','s04','email','birth','phone','mobile','address','joined'])if(typeof m[k]!=='string')throw Error('Mitgliedsdaten unvollständig');}const games=new Set();for(const g of x.games){if(games.has(g.id)||typeof g.id!=='string'||!['Heim','Auswärts'].includes(g.kind)||typeof g.opponent!=='string'||!Array.isArray(g.requests)||!Array.isArray(g.tickets))throw Error('Spieldaten ungültig');games.add(g.id);integer(g.quota,'Zuteilung');if(g.standing!==null&&(integer(g.standing,'Stehplätze')>g.quota))throw Error('Platzaufteilung ungültig');if(g.tickets.length>g.quota)throw Error('Zu viele Karten');for(const r of g.requests){integer(r.qty,'Wunsch');if(typeof r.name!=='string'||r.member&&!ids.has(r.member))throw Error('Wunschzuordnung ungültig');}for(const t of g.tickets){if(!ids.has(t.member)||!Array.isArray(t.transfers))throw Error('Karteninhaber ungültig');}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset;if(a.nav){view=a.nav;query='';render();}if(a.kind){kind=a.kind;render();}if(a.game){selected=a.game;view='detail';render();}if(a.quota)editQuota(a.quota);if(a.date)editDate(a.date);if(a.member)editMember(a.member);if(a.request)editRequest(a.request);if(a.ticket)editTicket(a.ticket);if(a.transfer)transfer(a.transfer);if(a.meeting)meeting(a.meeting);if(a.act)actions[a.act]?.();if(a.year){const y=Number(a.year),done=db.reviewedYears.includes(y);openDialog('Teilnahmejahr '+y,`<p class="full">${done?'Die Jahresprüfung wird wieder geöffnet.':'Bestätige nur, wenn alle Versammlungen dieses Jahres erfasst sind. Ohne Teilnahme wird der Fanclub für '+(y+1)+' als ausgeschlossen angezeigt.'}</p>`+check('Jahr vollständig geprüft','done',done),f=>{if(f.has('done')&&y>=new Date().getFullYear())throw Error('Das laufende und zukünftige Jahre können noch nicht abgeschlossen werden.');db.reviewedYears=db.reviewedYears.filter(v=>v!==y);if(f.has('done'))db.reviewedYears.push(y);save('Teilnahmejahr '+y+' geprüft');});}});
document.addEventListener('change',e=>{if(e.target.id==='gameSelect'){selected=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos);}catch{}}});
render();
</script></body></html>
