function tenantPortal(){return `<div class="intro"><div><div class="eyebrow">KARTENVERWALTUNG · TESTZENTRALE</div><h1>Zwei Fanclubs. Ein Einstieg.</h1><p>Wähle den Fanclub, mit dem du den Kartenablauf testen möchtest.</p></div><span class="badge blue">2 Testmandanten</span></div><div class="tenantgrid">${TENANTS.map((t,i)=>{const s=tenantStates[t.id];return `<section class="card tenantcard"><div class="tenantcover ${i?'second':''}"><span class="tenantemblem">${i?'BW':'IB'}</span><span>TESTMANDANT ${String(i+1).padStart(2,'0')}</span></div><div class="pad"><h2>${esc(s.club.name)}</h2><p>Bezirk ${esc(s.club.district)} · Dachverbandsnummer ${esc(s.club.association)}</p><div class="tenantmetrics"><div><strong>${s.members.length}</strong><small>Mitglieder</small></div><div><strong>${sum(s.games,demand)}</strong><small>Kartenwünsche</small></div><div><strong>${sum(s.games,g=>g.tickets.length)}</strong><small>Vergebene Karten</small></div></div>${tenantErrors[t.id]?'<p class="notice warn">Der gespeicherte Stand konnte nicht geladen werden. Die Ausgangsdaten werden angezeigt. Die bisherige Speicherung wurde nicht überschrieben.</p>':''}<button class="primary" data-tenant="${t.id}">Fanclub öffnen →</button></div></section>`;}).join('')}</div><div class="notice"><strong>So testest du die Trennung</strong><br>Bearbeite beispielsweise einen Mitgliedsnamen im ersten Fanclub. Kehre über „Fanclub wechseln“ hierher zurück und öffne den zweiten Club: Seine Daten bleiben unverändert. Beim erneuten Öffnen des ersten Clubs bleibt deine Änderung erhalten.</div><div class="notice warn">Lokale Mandanten-Demo mit fiktiven Daten. Getrennte Browser-Arbeitsstände, noch keine Benutzeranmeldung oder serverseitige Zugriffssicherung. Beide Testclubs sind für jeden Nutzer dieser Datei auswählbar.</div>`;}
const pages=[['season','▦','Saisonübersicht'],['allocation','▤','Zuteilung'],['tickets','♧','Interne Vergabe'],['members','♙','Mitglieder'],['district','◎','Bezirk & Teilnahme'],['data','⇄','Daten & Export']];
const member=id=>db.members.find(m=>m.id===id),full=m=>m?`${m.first} ${m.last}`:'Nicht zugeordnet',game=()=>db.games.find(g=>g.id===selected),sum=(a,f)=>a.reduce((n,x)=>n+f(x),0),demand=g=>sum(g.requests.filter(r=>!r.cancelled),r=>r.qty),assigned=g=>g.tickets.length;
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'Termin offen';
const badge=(s,c='gray')=>`<span class="badge ${c}">${esc(s)}</span>`;
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3500);}
function save(action){db.tenantId=activeTenant;tenantStates[activeTenant]=db;if(action)db.history.unshift({date:new Date().toISOString(),text:action});try{localStorage.setItem(KEY,JSON.stringify(db));storageError=false;delete tenantErrors[activeTenant];}catch(e){storageError=true;tenantErrors[activeTenant]=true;toast('Speichern im Browser fehlgeschlagen. Bitte Datensicherung exportieren.');}render();}
function download(name,content,type='text/plain;charset=utf-8'){name=activeTenant+'-'+name;const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function csv(name,rows){download(name,'\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Export erstellt');}
function field(label,name,value='',type='text',extra=''){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function select(label,name,values,value){return `<label>${esc(label)}<select name="${name}">${values.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;}
function check(label,name,value){return `<label class="full checkrow"><input type="checkbox" name="${name}" ${value?'checked':''}>${esc(label)}</label>`;}
function openDialog(title,html,submit){$('#dialogtitle').textContent=title;$('#fields').innerHTML=html;$('#error').textContent='';$('#form').onsubmit=e=>{e.preventDefault();try{submit(new FormData(e.target));$('#modal').close();}catch(err){$('#error').textContent=err.message;}};$('#modal').showModal();}
$('#close').onclick=$('#cancel').onclick=()=>$('#modal').close();
function integer(v,label){const n=Number(v);if(!Number.isSafeInteger(n)||n<0)throw Error(label+' muss eine ganze Zahl ab 0 sein.');return n;}
function eligible(g,m){if(!m)throw Error('Bitte ein Mitglied auswählen.');if(g.kind==='Auswärts'&&(!m.s04.trim()||!m.consent))throw Error('Für Auswärtskarten sind eine S04-Mitgliedsnummer und bestätigte Regelzustimmung erforderlich. Diese können unter Mitglieder hinterlegt werden.');}
function heading(title,sub,actions=''){return `<div class="intro"><div><div class="eyebrow">${esc(db.club.name)} · SAISON 2026/27</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;}
function stats(items){return `<div class="stats">${items.map(([label,n,sub],i)=>`<div class="stat ${i===1?'accent':''}"><label>${label}</label><strong>${n}</strong><small>${sub}</small></div>`).join('')}</div>`;}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Keine Einträge vorhanden.</td></tr>`}</tbody></table></div>`;}
function filterbar(){return `<div class="toolbar"><div class="tabs">${['Alle','Heim','Auswärts'].map(k=>`<button data-kind="${k}" class="${kind===k?'selected':''}">${k==='Alle'?'Alle Spiele':k+'spiele'}</button>`).join('')}</div><input class="search" id="search" type="search" value="${esc(query)}" placeholder="Gegner suchen …" aria-label="Gegner suchen"></div>`;}
function filtered(){return db.games.filter(g=>(kind==='Alle'||g.kind===kind)&&g.opponent.toLowerCase().includes(query.toLowerCase()));}
function split(g){return g.standing===null?badge('Aufteilung offen','amber'):`${g.standing} Steh · ${g.quota-g.standing} Sitz`;}
function season(){const gs=filtered();return heading('Jede Karte. Im Blick.','Wünsche, Zuteilungen und Vergabe für eure gemeinsame Saison.','<button data-act="exportSeason">↓ Saison exportieren</button>')+stats([['Saisonspiele',gs.length,kind==='Alle'?'17 Heim · 17 Auswärts':kind+'spiele'],['Kartenwünsche',sum(gs,demand),'Aktive Bestellungen'],['Vom Bezirk zugeteilt',sum(gs,g=>g.quota),'Steh- und Sitzplätze gesamt'],['Intern vergeben',sum(gs,assigned),'Einzelkarten an Mitglieder']])+`<section class="card"><div class="cardhead"><h2>Spielplan & Kartenübersicht</h2>${badge('2026 / 27','blue')}</div>${filterbar()}${table(['ST','Begegnung','Termin','Wünsche','Zuteilung','Vergabe',''],gs.map(g=>`<tr><td class="muted">${String(g.day).padStart(2,'0')}</td><td><strong>${esc(g.opponent)}</strong><small>${g.kind==='Heim'?'Heimspiel · VELTINS-Arena':'Auswärtsspiel'}</small></td><td>${date(g.date)}<small>${g.time?esc(g.time)+' Uhr':'Anstoß offen'}</small><button class="link dateedit" data-date="${g.id}">Termin bearbeiten</button></td><td class="num">${demand(g)}</td><td class="num"><strong>${g.quota}</strong></td><td>${badge(assigned(g)+' / '+g.quota,assigned(g)===g.quota&&g.quota?'green':g.quota?'blue':'gray')}<div class="progress"><i style="width:${g.quota?Math.min(100,assigned(g)/g.quota*100):0}%"></i></div></td><td><button class="link" data-game="${g.id}">Details →</button></td></tr>`))}<div class="statusline">${gs.length} Spiele · Demowünsche · Spielplan und Kontingente aus der Vorlage · Termine manuell bearbeitbar</div></section><div class="notice">${badge('Prototyp','blue')} &nbsp; Wünsche und Bezirkszuteilung sind getrennt. Die interne Vergabe dokumentiert jede einzelne Karte.</div>`;}
function allocations(){return heading('Zuteilung vom Bezirk','Das Kontingent des Fanclubs – getrennt von den Mitgliederwünschen.')+`<section class="card">${filterbar()}${table(['Spiel','Wünsche','Gesamtzuteilung','Steh- / Sitzplätze',''],filtered().map(g=>`<tr><td><strong>${esc(g.opponent)}</strong><small>${g.kind} · ${g.day}. Spieltag</small></td><td>${demand(g)}</td><td><b>${g.quota}</b></td><td>${split(g)}</td><td><button class="link" data-quota="${g.id}">Bearbeiten</button></td></tr>`))}</section><div class="notice">„Steher“ ohne Zahl wurde als vollständiges Stehplatzkontingent übernommen. Ohne Angabe bleibt die Aufteilung offen; Sitzplätze werden erst nach Eingabe der Stehplätze berechnet.</div>`;}
function detail(){const g=game();return `<button class="link back" data-nav="season">← Zur Saisonübersicht</button>`+heading(esc(g.opponent),`${g.kind} · ${g.day}. Spieltag · ${date(g.date)} · ${g.time||'Anstoß offen'}`,`<button data-date="${g.id}">Termin bearbeiten</button><button class="primary" data-quota="${g.id}">Zuteilung bearbeiten</button>`)+stats([['Kartenwünsche',demand(g),'Aktive Wünsche'],['Zuteilung',g.quota,g.standing===null?'Steh-/Sitzplätze offen':g.standing+' Steh · '+(g.quota-g.standing)+' Sitz'],['Intern vergeben',assigned(g),'Einzelkarten'],['Noch verfügbar',g.quota-assigned(g),'Für die interne Vergabe']])+`<section class="card"><div class="cardhead"><h2>Wünsche der Mitglieder</h2><button data-request="new" class="primary">+ Wunsch erfassen</button></div>${table(['Besteller / Bestellgruppe','Zuordnung','Anzahl','Status',''],g.requests.map(r=>`<tr><td><strong>${esc(r.name)}</strong></td><td>${esc(full(member(r.member)))}</td><td>${r.qty}</td><td>${badge(r.cancelled?'Storniert':r.preseason?'Vor Saison angefragt':'Nachträglich',r.cancelled?'gray':'blue')}</td><td><button class="link" data-request="${r.id}">Bearbeiten</button></td></tr>`))}</section><div class="notice">Die Wünsche sind frei erfunden und einzeln zugeordnet. Für eine Test-Auslosung kann die Regelzustimmung beim jeweiligen Demomitglied aktiviert werden.</div>`+ticketSection(g);}
function ticketSection(g){return `<section class="card"><div class="cardhead"><div><h2>Interne Kartenvergabe</h2><p style="margin:5px 0 0;font-size:12px">${esc(g.opponent)} · ${g.kind}</p></div><div class="actions"><button data-act="lottery">Auslosung</button><button class="primary" data-act="assign">+ Karte vergeben</button></div></div>${table(['Karte','Mitglied','Entscheidungsgrund','Nutzung & Kontrolle',''],g.tickets.map((t,i)=>`<tr><td><span class="ticketnum">#${String(i+1).padStart(3,'0')}</span><small>${esc(t.place)}</small></td><td><strong>${esc(full(member(t.member)))}</strong>${t.transfers.length?'<small>'+t.transfers.length+' Weitergabe(n)</small>':''}</td><td>${badge(t.reason,'blue')}</td><td>${badge(t.used===null?'Nutzung offen':t.used?'Genutzt':'Nicht genutzt',t.used?'green':'gray')} ${g.kind==='Auswärts'?badge(t.control?'Kontrolliert':'Kontrolle offen',t.control?'green':'amber'):''}<div class="ticketstatus">${badge(t.paid?'Bezahlt':'Zahlung offen',t.paid?'green':'red')} ${badge(t.retrieved?'Abgerufen':'Abruf offen',t.retrieved?'green':'orange')}</div>${g.kind==='Auswärts'?'<small>'+(t.personalized?'Personalisiert':'Personalisierung offen')+'</small>':''}</td><td><button class="link" data-ticket="${t.id}">Bearbeiten</button><button class="link" data-transfer="${t.id}">Weitergeben</button></td></tr>`))}${g.kind==='Auswärts'?'<div class="statusline">Auswärts: S04-Mitgliedschaft und Regelzustimmung erforderlich. Eine ausgeloste Karte ist verbindlich zu kaufen.</div>':''}</section>`;}
function tickets(){return heading('Von der Zuteilung ins Stadion','Vergabe, Abruf, Weitergabe und spätere Nutzung je Karte.')+`<div class="card pad"><label class="inline-label">Spiel auswählen<select id="gameSelect" style="margin-top:9px">${db.games.map(g=>`<option value="${g.id}" ${selected===g.id?'selected':''}>${g.day}. Spieltag · ${esc(g.opponent)} · ${g.kind} · ${g.quota} Karten</option>`).join('')}</select></label></div>`+ticketSection(game());}
function members(){return heading('Unsere Mitglieder','Stammdaten bearbeiten und für die Kartenvergabe verwenden.','<button data-act="exportMembers">↓ Mitglieder exportieren</button><button class="primary" data-member="new">+ Mitglied</button>')+`<section class="card"><div class="cardhead"><h2>${db.members.length} Fanclubmitglieder</h2>${badge('Fiktive Stammdaten','blue')}</div>${table(['Mitglied','Kontakt','S04-Mitgliedsnummer','Regelzustimmung',''],db.members.map(m=>`<tr><td><span class="avatar">${esc(m.first[0]+m.last[0])}</span><strong>${esc(full(m))}</strong></td><td>${esc(m.email||'Keine E-Mail')}<small>${esc(m.mobile||m.phone||'Keine Telefonnummer')}</small></td><td>${esc(m.s04||'Nicht hinterlegt')}</td><td>${badge(m.consent?'Bestätigt':'Nicht erfasst',m.consent?'green':'gray')}</td><td><button class="link" data-member="${m.id}">Bearbeiten</button></td></tr>`))}</section>`;}
function district(){const year=new Date().getFullYear();const rows=[year-1,year,year+1].map(y=>{const n=db.meetings.filter(m=>m.year===y&&m.attended).length,done=db.reviewedYears.includes(y);return `<tr><td>${y}</td><td>${n}</td><td>${badge(n?'Berechtigt':done?'Ausgeschlossen':'Noch nicht feststellbar',n?'green':done?'amber':'gray')}</td><td>${y+1}</td><td><button class="link" data-year="${y}">${done?'Jahresprüfung öffnen':'Jahr abschließen'}</button></td></tr>`});return heading('Bezirk 23 & Teilnahme','Versammlungen dokumentieren und die Berechtigung im Folgejahr nachvollziehen.',`<button data-act="club">Fanclub bearbeiten</button>`)+`<div class="grid2"><section class="card pad"><h3>${esc(db.club.name)}</h3><p>Dachverbandsnummer <b>${esc(db.club.association)}</b><br>Debitorennummer Schalke 04 <b>${esc(db.club.debtor||'Noch nicht hinterlegt')}</b><br>Bezirk <b>${esc(db.club.district)}</b></p></section><section class="card pad"><h3>Teilnahmeregel</h3><p>Mindestens eine Teilnahme im Kalenderjahr berechtigt zur Verteilung im Folgejahr. Ein vollständig geprüftes Jahr ohne Teilnahme führt zum Ausschluss.</p></section></div><section class="card"><div class="cardhead"><h2>Jahresübersicht</h2></div>${table(['Jahr','Teilnahmen','Status im Folgejahr','Gültig für',''],rows)}</section><section class="card"><div class="cardhead"><h2>Bezirksversammlungen</h2><button class="primary" data-meeting="new">+ Teilnahme erfassen</button></div>${table(['Datum','Versammlung','Teilgenommen',''],db.meetings.map(m=>`<tr><td>${date(m.date)}</td><td>${esc(m.name)}</td><td>${badge(m.attended?'Ja':'Nein',m.attended?'green':'gray')}</td><td><button class="link" data-meeting="${m.id}">Bearbeiten</button></td></tr>`))}</section><div class="notice">Es wurden keine Versammlungsteilnahmen mitgeliefert. Fehlende Daten sind kein automatischer Ausschluss. Teilnahmen und Berechtigungen gelten nur für den ausgewählten Fanclub.</div>`;}
function dataView(){return heading('Daten, die mitkommen','Fiktive Mitgliederdaten, Exporte und Sicherung des Demo-Arbeitsstands.')+`<div class="grid2"><section class="card pad"><h3>Demodaten geladen</h3><p>Mitglieder: ${db.members.length}<br>Spielpaarungen: ${db.games.length} Saisonspiele<br>Aktuell: ${sum(db.games,demand)} Wünsche / ${sum(db.games,g=>g.quota)} Karten</p><p>Aktiver Fanclub: ${esc(db.club.name)}. Alle Mitgliederdaten und persönlichen Wünsche sind fiktiv. Der zweite Club nutzt eigene Testkontingente. Spieltermine stammen aus der Vorlage.</p><button data-act="preview">Importvorschau ansehen</button></section><section class="card pad"><h3>Arbeitsstand sichern</h3><p>Änderungen werden nur in diesem Browser gespeichert. Eine Datensicherung enthält nur den ausgewählten Fanclub einschließlich Mitglieder, Wünsche, Karten, Weitergaben und Protokoll. Sicherungen anderer Testclubs werden beim Laden abgewiesen.</p><div class="actions"><button class="primary" data-act="backup">Sicherung exportieren</button><button data-act="restore">Sicherung laden</button></div></section><section class="card pad"><h3>Für die weitere Bearbeitung</h3><p>CSV-Dateien lassen sich in Excel öffnen.</p><div class="actions"><button data-act="exportMembers">Mitglieder CSV</button><button data-act="exportSeason">Saison CSV</button><button data-act="exportTickets">Einzelkarten CSV</button><button data-act="exportRequests">Wünsche CSV</button></div></section><section class="card pad"><h3>Stand dieses Prototyps</h3><p>Keine Benutzerrollen oder gemeinsame Datenbank. Regelzustimmungen werden manuell dokumentiert. E-Mail-Versand und Kartenabruf bei Schalke erfolgen außerhalb der Anwendung. Weitere Excel-/CSV-Importe sind als Vorschau abgebildet.</p></section></div><section class="card"><div class="cardhead"><h2>Änderungsprotokoll</h2>${badge(db.history.length+' Einträge')}</div><div class="pad">${db.history.slice(0,100).map(h=>`<div class="history">${esc(h.text)}<br><small>${new Date(h.date).toLocaleString('de-DE')}</small></div>`).join('')||'<p>Noch keine Änderungen. Die Ausgangsdaten sind bereit.</p>'}</div></section>`;}
function render(){
const portal=view==='tenants';
$('#brandname').textContent=portal?'Fanclub-Zentrale':db.club.name;
$('#tenantlabel').textContent=portal?'MANDANTENVERWALTUNG':`AKTIV · ${db.club.name}`;
$('#brandlogo').style.display=!portal&&activeTenant==='ironblue'?'':'none';
$('#brandfallback').style.display=!portal&&activeTenant==='ironblue'?'none':'';
$('#brandfallback').textContent=portal?'FC':'BW';
$('#backup').style.display=portal?'none':'';
$('#footerclub').textContent=portal?'FANCLUB-ZENTRALE':db.club.name;
if(portal){$('#nav').innerHTML='<button class="active" data-nav="tenants">◎ Fanclubs auswählen</button>';$('#crumb').textContent='Fanclub-Auswahl';$('#app').innerHTML=tenantPortal();return;}
if(!game())selected=db.games[0].id;$('#nav').innerHTML='<button class="tenantback" data-nav="tenants">← Fanclub wechseln</button>'+pages.map(([id,icon,label])=>`<button data-nav="${id}" class="${view===id||view==='detail'&&id==='season'?'active':''}"><span class="symbol">${icon}</span>${label}</button>`).join('');$('#crumb').textContent=view==='detail'?'Spieldetails':pages.find(p=>p[0]===view)?.[2]||'';$('#app').innerHTML='<div class="notice warn"><strong>DEMOVERSION · Fiktive Mitgliederdaten</strong><br>Alle Mitgliedernamen, Kontaktdaten und persönlichen Wünsche sind erfunden. Bitte keine echten personenbezogenen Daten eintragen. Änderungen bleiben in diesem Browser.</div>'+(storageError?'<div class="notice warn">Browserspeicher nicht verfügbar. Änderungen bitte als Datensicherung exportieren.</div>':'')+({season,allocation:allocations,detail,tickets,members,district,data:dataView}[view]());}
function editMember(id){const m=id==='new'?{id:crypto.randomUUID(),first:'',last:'',consent:false}:member(id);openDialog(id==='new'?'Mitglied hinzufügen':full(m),field('Vorname','first',m.first,'text','required')+field('Nachname','last',m.last,'text','required')+field('Geburtsdatum','birth',m.birth,'date')+field('Eintrittsdatum / Angabe','joined',m.joined)+field('Telefon','phone',m.phone)+field('Mobil','mobile',m.mobile)+field('E-Mail','email',m.email,'email')+field('S04-Mitgliedsnummer','s04',m.s04)+`<div class="full">${field('Adresse','address',m.address)}</div>`+check('Zustimmung zu den Auswärtskartenregeln liegt vor','consent',m.consent),f=>{const next={...m,...Object.fromEntries(f),consent:f.has('consent')};next.first=next.first.trim();next.last=next.last.trim();if(!next.first||!next.last)throw Error('Vor- und Nachname dürfen nicht leer sein.');if(id==='new')db.members.push(next);else Object.assign(m,next);save('Mitglied bearbeitet: '+full(next));});}
function editQuota(id){const g=db.games.find(g=>g.id===id);openDialog('Bezirkszuteilung bearbeiten',`<p class="full">${esc(g.opponent)} · ${g.kind}. Stehplätze sind in der Gesamtzahl enthalten.</p>`+field('Gesamtzuteilung','quota',g.quota,'number','min="0" required')+field('Davon Stehplätze (leer = offen)','standing',g.standing??'','number','min="0"'),f=>{const q=integer(f.get('quota'),'Gesamtzuteilung'),s=f.get('standing')===''?null:integer(f.get('standing'),'Stehplätze');if(s!==null&&s>q)throw Error('Stehplätze dürfen die Gesamtzuteilung nicht überschreiten.');if(q<g.tickets.length)throw Error('Die Gesamtzuteilung ist kleiner als die bereits vergebenen Karten.');if(s!==null&&(g.tickets.filter(t=>t.place==='Stehplatz').length>s||g.tickets.filter(t=>t.place==='Sitzplatz').length>q-s))throw Error('Die Aufteilung widerspricht bereits vergebenen Platzarten.');g.quota=q;g.standing=s;save('Zuteilung geändert: '+g.opponent+' ('+q+' Karten)');});}
function editDate(id){const g=db.games.find(g=>g.id===id);openDialog('Spieltermin bearbeiten',field('Datum','date',g.date,'date','required')+field('Anstoß (leer = offen)','time',g.time,'time'),f=>{g.date=f.get('date');g.time=f.get('time');save('Spieltermin geändert: '+g.opponent);});}
function editRequest(id){const g=game(),r=id==='new'?{id:crypto.randomUUID(),name:'',member:'',qty:1,cancelled:false,preseason:false}:g.requests.find(r=>r.id===id);openDialog('Kartenwunsch bearbeiten',field('Besteller / Gruppenname','name',r.name,'text','required')+select('Mitglied / Ansprechpartner','member',[['','Nicht zugeordnet'],...db.members.map(m=>[m.id,full(m)])],r.member)+field('Gewünschte Karten','qty',r.qty,'number','min="0" required')+check('Vor der Saison angefragt','preseason',r.preseason)+check('Bestellung storniert','cancelled',r.cancelled),f=>{requireManager();const qty=quantity(f.get('qty'),'Kartenanzahl');const next={...r,name:f.get('name').trim(),member:f.get('member'),qty,cancelled:f.has('cancelled'),preseason:f.has('preseason')};if(!next.name)throw Error('Bitte einen Namen angeben.');if(id==='new')g.requests.push(next);else Object.assign(r,next);save('Wunsch geändert: '+next.name+' / '+g.opponent);});}

// Local role simulation. Authorization must move to the backend for production.
const demoRoles={ironblue:'admin',testclub:'admin'};
const canManage=()=>['admin','karten'].includes(demoRoles[activeTenant]);
function requireManager(){if(!canManage())throw Error('Nur Kartenbeauftragte oder Admins dürfen diese Änderung vornehmen.');}
function guardManager(fn){return (...args)=>{try{requireManager();return fn(...args);}catch(e){toast(e.message);}};}
function quantity(value,label){if(String(value).trim()===''||!/^\d+$/.test(String(value)))throw Error(label+': bitte eine ganze Zahl ab 0 eintragen.');return integer(value,label);}
function checkQuota(g){if(g.tickets.length>g.quota)throw Error('Mehr vergebene Karten als Bezirkszuteilung: '+g.opponent);if(g.standing!==null){if(g.standing>g.quota)throw Error('Stehplätze überschreiten Gesamtzahl: '+g.opponent);for(const p of ['Stehplatz','Sitzplatz']){const max=p==='Stehplatz'?g.standing:g.quota-g.standing;if(g.tickets.filter(t=>t.place===p).length>max)throw Error('Bereits vergebene '+p+'-Karten überschreiten die Zuteilung: '+g.opponent);}}}
editQuota=guardManager(function(id){const g=db.games.find(x=>x.id===id);openDialog('Zuteilung des Bezirks',`<p class="full">${esc(g.opponent)} · ${g.kind}. Steh- und Sitzplätze ergeben zusammen das feste Kontingent. Die interne Vergabe verändert diese Zahlen nicht.</p>`+field('Stehplätze','standing',g.standing??0,'number','min="0" required')+field('Sitzplätze','seated',g.standing===null?0:g.quota-g.standing,'number','min="0" required')+`<p class="full" id="quotaTotal">Gesamt: ${g.quota} Karten${g.standing===null?' · noch ohne Platzart; Steh- und Sitzplätze bitte ergänzen':''}</p>`,f=>{requireManager();const s=quantity(f.get('standing'),'Stehplätze'),seated=quantity(f.get('seated'),'Sitzplätze');const next={...g,standing:s,quota:s+seated};checkQuota(next);Object.assign(g,next);save(`Bezirkszuteilung geändert: ${g.opponent} / ${s} Stehplätze / ${seated} Sitzplätze / ${s+seated} gesamt`);});});
document.addEventListener('input',e=>{if(['standing','seated'].includes(e.target.name)&&$('#quotaTotal')){const f=new FormData($('#form'));const a=f.get('standing'),b=f.get('seated');$('#quotaTotal').textContent=a!==''&&b!==''?'Gesamt: '+(Number(a)+Number(b))+' Karten':'Bitte beide Platzarten angeben.';}});
const baseRequest=editRequest;
editRequest=guardManager(baseRequest);
// Existing dialog implementation now permits zero; role wrapper protects opening it.
allocations=function(){return heading('Zuteilung vom Bezirk','Festes Kontingent je Spiel. Die weitere Verteilung erfolgt unter „Interne Vergabe“.')+`<section class="card">${filterbar()}${table(['Spiel','Wünsche','Gesamt','Stehplätze','Sitzplätze',''],filtered().map(g=>`<tr><td><strong>${esc(g.opponent)}</strong><small>${g.kind} · ${g.day}. Spieltag</small></td><td>${demand(g)}</td><td><b>${g.quota}</b></td><td>${g.standing===null?badge('Offen','amber'):g.standing}</td><td>${g.standing===null?badge('Offen','amber'):g.quota-g.standing}</td><td>${canManage()?`<button class="link" data-quota="${g.id}">Bearbeiten</button>`:badge('Nur Ansicht')}</td></tr>`))}</section><div class="notice">Ohne Angabe in der Ausgangsliste bleibt die Aufteilung offen. Kartenbeauftragte oder Admins können konkrete Steh- und Sitzplatzmengen hinterlegen. Bereits vergebene Karten werden bei Änderungen berücksichtigt.</div>`;};
const baseDetail=detail;
detail=function(){let html=baseDetail();if(!canManage())html=html.replace(/<button[^>]*data-quota="[^"]*"[^>]*>.*?<\/button>/g,'').replace(/<button[^>]*data-request="[^"]*"[^>]*>.*?<\/button>/g,'');return html;};
const baseRender=render;
render=function(){baseRender();if(view==='tenants')return;$('#app').innerHTML=`<div class="rolebar"><div><strong>Testrolle</strong><small>Frei umschaltbare Simulation · keine Zugriffssicherung</small></div><select id="testRole" aria-label="Testrolle"><option value="admin" ${demoRoles[activeTenant]==='admin'?'selected':''}>Admin</option><option value="karten" ${demoRoles[activeTenant]==='karten'?'selected':''}>Kartenbeauftragter</option><option value="mitglied" ${demoRoles[activeTenant]==='mitglied'?'selected':''}>Mitglied</option></select></div>`+$('#app').innerHTML;};
document.addEventListener('change',e=>{if(e.target.id==='testRole'){demoRoles[activeTenant]=e.target.value;render();}});

const MEMBER_FIELDS=[['Vorname','first'],['Nachname','last'],['Geburtsdatum','birth'],['Telefon','phone'],['Mobil','mobile'],['Adresse','address'],['S04-Mitgliedsnummer','s04'],['E-Mail','email'],['Eintrittsdatum','joined']];
const yes=v=>v?'Ja':'Nein';
function exportRows(type,state=db){const tenant=state.tenantId||activeTenant;
 if(type==='members')return [['Mandant','Mitglied-ID',...MEMBER_FIELDS.map(x=>x[0]),'Regelzustimmung'],...state.members.map(m=>[tenant,m.id,...MEMBER_FIELDS.map(x=>m[x[1]]),yes(m.consent)])];
 if(type==='season')return [['Mandant','Spiel-ID','Spieltag','Heim/Auswärts','Gegner','Datum','Anstoß','Wünsche','Zuteilung','Stehplätze','Sitzplätze','Intern vergeben'],...state.games.map(g=>[tenant,g.id,g.day,g.kind,g.opponent,g.date,g.time,demand(g),g.quota,g.standing??'',g.standing===null?'':g.quota-g.standing,g.tickets.length])];
 if(type==='requests')return [['Mandant','Wunsch-ID','Spiel-ID','Spieltag','Art','Gegner','Mitglied-ID','Besteller','Mitglied','Menge','Vor Saison','Storniert'],...state.games.flatMap(g=>g.requests.map(r=>[tenant,r.id,g.id,g.day,g.kind,g.opponent,r.member,r.name,full(state.members.find(m=>m.id===r.member)),r.qty,yes(r.preseason),yes(r.cancelled)]))];
 return [['Mandant','Karten-ID','Spiel-ID','Spieltag','Heim/Auswärts','Gegner','Mitglied-ID','Mitglied','Grund','Platzart','Bezahlt','Abgerufen','Personalisiert','Genutzt','Kontrolliert','Weitergaben-JSON'],...state.games.flatMap(g=>g.tickets.map(t=>[tenant,t.id,g.id,g.day,g.kind,g.opponent,t.member,full(state.members.find(m=>m.id===t.member)),t.reason,t.place,yes(t.paid),yes(t.retrieved),yes(t.personalized),t.used===null?'Offen':yes(t.used),yes(t.control),JSON.stringify(t.transfers)]))];
}
for(const [type,action,name] of [['members','exportMembers','Mitglieder'],['season','exportSeason','Saison'],['requests','exportRequests','Wuensche'],['tickets','exportTickets','Einzelkarten']])actions[action]=()=>csv('DEMO-'+name+'.csv',exportRows(type));

function parseCsv(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0];const delim=first.includes(';')?';':first.includes('\t')?'\t':',';const rows=[];let row=[],cell='',quoted=false,ended=false;

 else if(c==='"'){if(cell||ended)throw Error('Ungültiges Anführungszeichen in CSV.');quoted=true;}

 if(quoted)throw Error('Nicht geschlossenes Anführungszeichen in CSV.');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows;
}
function boolCell(v,label){const s=String(v).trim().toLowerCase();if(['ja','true','1','bestätigt'].includes(s))return true;if(['nein','false','0','','nicht erfasst'].includes(s))return false;throw Error(label+': erwartet Ja oder Nein.');}
function dateCell(v,label){if(!v)return '';let s=String(v);if(/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)){const [d,m,y]=s.split('.');s=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!Number.isFinite(Date.parse(s))||new Date(s).toISOString().slice(0,10)!==s)throw Error(label+': ungültiges Datum.');return s;}
const ALIASES={'Name':'Vorname','Gebutsdatum':'Geburtsdatum','Tel.Nr.':'Telefon','HandyNr.':'Mobil','Art':'Heim/Auswärts'};
function recordsFromRows(rows,type){const required=type==='members'?['Vorname','Nachname']:type==='season'?['Spieltag','Gegner','Datum','Zuteilung','Stehplätze','Sitzplätze']:type==='requests'?['Besteller','Menge','Vor Saison','Storniert']:['Karten-ID','Mitglied','Grund','Platzart','Bezahlt','Abgerufen','Genutzt'];
 const index=rows.findIndex(row=>required.every(k=>row.map(x=>ALIASES[String(x).trim()]||String(x).trim()).includes(k)));if(index<0)throw Error('Die erforderlichen Spalten fehlen. Bitte den passenden Export als Vorlage verwenden.');
 const headers=rows[index].map(x=>ALIASES[String(x).trim()]||String(x).trim());const nonempty=headers.filter(Boolean);if(new Set(nonempty).size!==nonempty.length)throw Error('Doppelte Spaltenüberschriften.');
 const records=[];for(let i=index+1;i<rows.length;i++){const row=rows[i];if(!row.some(v=>String(v).trim()))continue;if(row.length>headers.length&&row.slice(headers.length).some(v=>String(v).trim()))throw Error('Zeile '+(i+1)+': zu viele Spalten.');const record={};headers.forEach((h,j)=>{if(h){const v=String(row[j]??'');record[h]=v.replace(/^'(?=[=+@-])/,'');}});records.push({record,line:i+1});}
 return records;
}
function stageImport(type,rows){requireManager();const next=structuredClone(db),seen=new Set(),preview=[];const records=recordsFromRows(rows,type);
 const getMember=(r,optional=false)=>{if(r['Mitglied-ID']){const m=next.members.find(m=>m.id===r['Mitglied-ID']);if(!m)throw Error('Unbekannte Mitglied-ID.');return m;}if(!r.Mitglied||r.Mitglied==='Nicht zugeordnet'){if(optional)return null;throw Error('Mitglied fehlt.');}const matches=next.members.filter(m=>full(m)===r.Mitglied);if(matches.length!==1)throw Error('Mitgliedsname fehlt oder ist nicht eindeutig.');return matches[0];};
 const getGame=r=>{let candidates=r['Spiel-ID']?next.games.filter(g=>g.id===r['Spiel-ID']):next.games.filter(g=>String(g.day)===r.Spieltag&&g.kind===r['Heim/Auswärts']);if(candidates.length!==1)throw Error('Spiel nicht eindeutig gefunden.');const g=candidates[0];if(r.Spieltag&&String(g.day)!==r.Spieltag||r['Heim/Auswärts']&&g.kind!==r['Heim/Auswärts'])throw Error('Spiel-ID und Spieltag/Spielart widersprechen sich.');return g;};
 for(const {record:r,line} of records){try{if(r.Mandant&&r.Mandant!==activeTenant)throw Error('Datei gehört zu einem anderen Fanclub.');let identity,label,change;
 if(type==='members'){if(!r.Vorname.trim()||!r.Nachname.trim())throw Error('Vor- und Nachname fehlen.');let m;
 if(r['Mitglied-ID'])m=next.members.find(m=>m.id===r['Mitglied-ID']);else {const candidates=next.members.filter(m=>(r['S04-Mitgliedsnummer']&&m.s04===r['S04-Mitgliedsnummer'])||(m.first===r.Vorname&&m.last===r.Nachname));if(candidates.length>1)throw Error('Mitglied nicht eindeutig. Bitte mit Mitglied-ID importieren.');m=candidates[0];}
 const added=!m;if(!m)m={id:r['Mitglied-ID']||crypto.randomUUID(),first:'',last:'',birth:'',phone:'',mobile:'',address:'',s04:'',email:'',joined:'',consent:false};identity=m.id;label=r.Vorname+' '+r.Nachname;
 for(const [h,k] of MEMBER_FIELDS)if(h in r)m[k]=r[h];m.birth=dateCell(m.birth,'Geburtsdatum');if(m.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.email))throw Error('E-Mail-Adresse ungültig.');if('Regelzustimmung' in r)m.consent=boolCell(r.Regelzustimmung,'Regelzustimmung');if(added)next.members.push(m);change=added?'Neu':'Aktualisieren';
 }else{const g=getGame(r);label=g.opponent;
 if(type==='requests'&&r['Wunsch-ID']&&next.games.some(other=>other.id!==g.id&&other.requests.some(x=>x.id===r['Wunsch-ID'])))throw Error('Wunsch-ID gehört zu einem anderen Spiel.');
 if(type==='tickets'&&r['Karten-ID']&&next.games.some(other=>other.id!==g.id&&other.tickets.some(x=>x.id===r['Karten-ID'])))throw Error('Karten-ID gehört zu einem anderen Spiel.');
 if(type==='season'){identity=g.id;g.date=dateCell(r.Datum,'Spieldatum');if(!g.date)throw Error('Spieldatum fehlt.');if(r.Anstoß&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.Anstoß))throw Error('Anstoß muss HH:MM sein.');g.time=r.Anstoß||'';const quota=quantity(r.Zuteilung,'Zuteilung'),s=r.Stehplätze===''?null:quantity(r.Stehplätze,'Stehplätze'),seat=r.Sitzplätze===''?null:quantity(r.Sitzplätze,'Sitzplätze');if((s===null)!==(seat===null)||s!==null&&s+seat!==quota)throw Error('Stehplätze und Sitzplätze müssen zusammen die Gesamtzuteilung ergeben.');g.quota=quota;g.standing=s;change='Termin / Kontingent';
 }else if(type==='requests'){const m=getMember(r,true);if(!r.Besteller.trim())throw Error('Besteller fehlt.');let existing=r['Wunsch-ID']?g.requests.find(x=>x.id===r['Wunsch-ID']):null;if(!r['Wunsch-ID']){const found=g.requests.filter(x=>x.name===r.Besteller&&x.member===(m?.id||''));if(found.length>1)throw Error('Wunsch nicht eindeutig. Bitte Wunsch-ID verwenden.');existing=found[0];}const request={id:existing?.id||r['Wunsch-ID']||crypto.randomUUID(),name:r.Besteller,member:m?.id||'',qty:quantity(r.Menge,'Menge'),preseason:boolCell(r['Vor Saison'],'Vor Saison'),cancelled:boolCell(r.Storniert,'Storniert')};identity=g.id+'/'+request.id;label+=' · '+r.Besteller;change=existing?'Aktualisieren':'Neu';if(existing)Object.assign(existing,request);else g.requests.push(request);
 }else{const m=getMember(r),existing=g.tickets.find(t=>t.id===r['Karten-ID']);if(!r['Karten-ID'])throw Error('Karten-ID fehlt.');if(!['Nach Absprache','Nach Auslosung','Nach Kartenwunsch'].includes(r.Grund))throw Error('Unbekannter Entscheidungsgrund.');if(!['Noch offen','Stehplatz','Sitzplatz'].includes(r.Platzart))throw Error('Unbekannte Platzart.');if(g.kind==='Auswärts'&&(!existing||existing.member!==m.id))eligible(g,m);
 let transfers=existing?structuredClone(existing.transfers):[];if('Weitergaben-JSON' in r){try{transfers=JSON.parse(r['Weitergaben-JSON']||'[]');}catch{throw Error('Weitergaben-JSON ist ungültig.');}if(!Array.isArray(transfers)||transfers.some(t=>!next.members.some(m=>m.id===t.from)||!next.members.some(m=>m.id===t.to)||typeof t.note!=='string'||!Number.isFinite(Date.parse(t.date))))throw Error('Weitergabehistorie ist ungültig.');}
 if(existing&&JSON.stringify(transfers.slice(0,existing.transfers.length))!==JSON.stringify(existing.transfers))throw Error('Bestehende Weitergabehistorie darf nicht entfernt oder verändert werden.');
 const changedOwner=existing&&existing.member!==m.id;if(changedOwner&&!(transfers.length>existing.transfers.length&&transfers.at(-1).from===existing.member&&transfers.at(-1).to===m.id))transfers.push({from:existing.member,to:m.id,date:new Date().toISOString(),note:'Weitergabe durch CSV-Import'});
 const t={id:r['Karten-ID'],member:m.id,reason:r.Grund,place:r.Platzart,paid:boolCell(r.Bezahlt,'Bezahlt'),retrieved:boolCell(r.Abgerufen,'Abgerufen'),personalized:g.kind==='Auswärts'?boolCell(r.Personalisiert,'Personalisiert'):false,control:g.kind==='Auswärts'?boolCell(r.Kontrolliert,'Kontrolliert'):false,used:r.Genutzt==='Offen'||r.Genutzt===''?null:boolCell(r.Genutzt,'Genutzt'),transfers};if(changedOwner){t.personalized=false;t.control=false;t.used=null;}identity=g.id+'/'+t.id;label+=' · '+full(m);change=existing?'Aktualisieren':'Neu';if(existing)Object.assign(existing,t);else g.tickets.push(t);
 }}
 if(seen.has(identity))throw Error('Datensatz kommt mehrfach in der Datei vor.');seen.add(identity);preview.push({line,label,change});
 }catch(e){throw Error('Zeile '+line+': '+e.message);}}
 validateBackup(next);for(const g of next.games)checkQuota(g);
 return {tenant:activeTenant,type,next,preview,base:JSON.stringify(db),unscoped:records.some(x=>!x.record.Mandant)};
}
function commitImport(staged){requireManager();if(activeTenant!==staged.tenant)throw Error('Fanclub wurde gewechselt. Datei bitte erneut prüfen.');if(JSON.stringify(db)!==staged.base)throw Error('Der Datenstand hat sich geändert. Datei bitte erneut prüfen.');validateBackup(staged.next);for(const g of staged.next.games)checkQuota(g);db=staged.next;tenantStates[activeTenant]=db;save(`${staged.preview.length} Datensätze importiert (${staged.type})`);}

function xmlDoc(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('Ungültiger XML-Inhalt in Excel-Datei.');return doc;}
async function readMemberXlsx(buffer){const zip=await JSZip.loadAsync(buffer);const file=async name=>{const f=zip.file(name);return f?xmlDoc(await f.async('string')):null;};
 const shared=await file('xl/sharedStrings.xml');const strings=shared?[...shared.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
 const workbook=await file('xl/workbook.xml'),rels=await file('xl/_rels/workbook.xml.rels');if(!workbook||!rels)throw Error('Keine unterstützte XLSX-Arbeitsmappe.');
 const date1904=workbook.getElementsByTagName('workbookPr')[0]?.getAttribute('date1904');
 for(const sheet of workbook.getElementsByTagName('sheet')){const rid=sheet.getAttribute('r:id'),rel=[...rels.getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid);if(!rel)continue;const target=rel.getAttribute('Target');if(target.includes('..')||rel.getAttribute('TargetMode')==='External')continue;const path=target.startsWith('/')?target.slice(1):'xl/'+target;const doc=await file(path);if(!doc)continue;const rows=[];
 for(const row of doc.getElementsByTagName('row')){const cells=[];for(const c of row.getElementsByTagName('c')){const ref=c.getAttribute('r')||'',letters=ref.replace(/[0-9]/g,'');let col=0;for(const char of letters)col=col*26+char.charCodeAt(0)-64;const v=c.getElementsByTagName('v')[0]?.textContent||'';const type=c.getAttribute('t');cells[col-1]=type==='s'?(strings[Number(v)]??''):type==='inlineStr'?[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''):v;}rows.push(Array.from({length:cells.length},(_,i)=>cells[i]||''));}
 const header=rows.findIndex(r=>r.includes('Nachname')&&(r.includes('Name')||r.includes('Vorname')));if(header<0)continue;const headings=rows[header];for(let i=header+1;i<rows.length;i++)for(let j=0;j<headings.length;j++)if(['Gebutsdatum','Geburtsdatum','Eintrittsdatum'].includes(headings[j])&&/^\d+(\.\d+)?$/.test(rows[i][j]||'')){const epoch=date1904==='1'||date1904==='true'?Date.UTC(1904,0,1):Date.UTC(1899,11,30);rows[i][j]=new Date(epoch+Math.floor(Number(rows[i][j]))*86400000).toISOString().slice(0,10);}return rows;
 }throw Error('Kein Tabellenblatt mit Vorname/Name und Nachname gefunden.');
}
function importFile(type){requireManager();const tenant=activeTenant;const input=document.createElement('input');input.type='file';input.accept=type==='members'?'.csv,.xlsx':'.csv';input.onchange=async()=>{if(!input.files?.length)return;try{const f=input.files[0];if(f.size>5*1024*1024)throw Error('Bitte Dateien bis maximal 5 MB verwenden.');const buffer=await f.arrayBuffer();let rows;
 if(f.name.toLowerCase().endsWith('.xlsx')){if(type!=='members')throw Error('Excel-Import ist für die Mitgliederliste vorgesehen.');rows=await readMemberXlsx(buffer);}else{let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buffer);}catch{text=new TextDecoder('windows-1252').decode(buffer);}rows=parseCsv(text);}
 if(activeTenant!==tenant)throw Error('Fanclub wurde gewechselt. Bitte Datei erneut auswählen.');const staged=stageImport(type,rows);openDialog('Import prüfen · '+db.club.name,`<p class="full">${staged.preview.length} Datensätze aus ${esc(f.name)}. Bestehende Einträge werden anhand ihrer IDs aktualisiert, neue ergänzt. Nicht enthaltene Einträge bleiben erhalten.</p>${staged.unscoped?'<p class="full notice warn">Diese Datei enthält keine vollständige Mandantenkennung. Sie wird ausschließlich dem aktuell ausgewählten Fanclub zugeordnet.</p>':''}<div class="full importpreview">${table(['Zeile','Datensatz','Aktion'],staged.preview.slice(0,100).map(r=>`<tr><td>${r.line}</td><td>${esc(r.label)}</td><td>${r.change}</td></tr>`))}</div>${staged.preview.length>100?'<p class="full">Vorschau auf die ersten 100 Zeilen begrenzt; alle Zeilen wurden geprüft.</p>':''}<p class="full">Die Datei wird nur lokal verarbeitet. In dieser Demo bitte ausschließlich fiktive Mitgliederdaten verwenden.</p>`+check('Vorschau und ausgewählten Fanclub geprüft','confirm',false),f=>{if(!f.has('confirm'))throw Error('Bitte die Vorschau bestätigen.');commitImport(staged);toast('Import übernommen');});}catch(e){openDialog('Import nicht übernommen',`<p class="full">${esc(e.message)}</p><p class="full">Es wurden keine Daten verändert.</p>`,()=>{});}};input.click();}
for(const type of ['members','season','requests','tickets'])actions['import'+type]=guardManager(()=>importFile(type));
const baseDataView=dataView;
dataView=function(){return heading('Daten importieren & exportieren','Dateien prüfen, Änderungen übernehmen und den Arbeitsstand sichern.')+`<section class="card"><div class="cardhead"><h2>Dateien für ${esc(db.club.name)}</h2>${badge(canManage()?'Import freigeschaltet':'Import nur für Kartenbeauftragte / Admins',canManage()?'blue':'gray')}</div>${table(['Bereich','Export','Import'],[['members','Mitglieder','exportMembers','CSV oder XLSX'],['season','Saison & Zuteilung','exportSeason','CSV'],['requests','Kartenwünsche','exportRequests','CSV'],['tickets','Einzelkarten','exportTickets','CSV']].map(([type,label,action,format])=>`<tr><td><strong>${label}</strong></td><td><button data-act="${action}">↓ CSV exportieren</button></td><td><button data-act="import${type}" ${canManage()?'':'disabled'}>↑ ${format} importieren</button></td></tr>`))}</section><div class="notice">Zum Bearbeiten zuerst die aktuelle CSV exportieren. IDs und Mandantenkennung unverändert lassen. Im Saisonimport sind Wünsche und „Intern vergeben“ berechnete Anzeigewerte; Änderungen daran bitte über Wünsche bzw. Einzelkarten importieren. Im Kartenimport bleiben Weitergaben erhalten. Ein Inhaberwechsel setzt Nutzung, Personalisierung und Kontrolle zurück.</div>`+baseDataView().slice(baseDataView().indexOf('<div class="grid2">')).replace('Weitere Excel-/CSV-Importe sind als Vorschau abgebildet.','CSV-Importe für alle Exportbereiche und XLSX-Mitgliederimporte sind verfügbar.').replace('<button data-act="preview">Importvorschau ansehen</button>','');};
const baseMembers=members;
members=function(){return baseMembers().replace('<button data-act="exportMembers">',`${canManage()?'<button data-act="importmembers">↑ Mitglieder importieren</button>':''}<button data-act="exportMembers">`);};
// JSON restore can also change quotas, so restrict it like file imports.
actions.restore=guardManager(actions.restore);

</script><script>'use strict';
allocations=function(){return heading('Zuteilung vom Bezirk','Festes Kontingent je Spiel. Die weitere Verteilung erfolgt unter „Interne Vergabe“.')+`<section class="card">${filterbar()}${table(['Spiel','Wünsche','Gesamt','Stehplätze','Sitzplätze',''],filtered().map(g=>`<tr><td><strong>${esc(g.opponent)}</strong><small>${g.kind} · ${g.day}. Spieltag</small></td><td>${demand(g)}</td><td><b>${g.quota}</b>${g.standing===null&&g.quota?`<small>${g.quota} noch ohne Platzart</small>`:''}</td><td>${g.standing??0}</td><td>${g.standing===null?0:g.quota-g.standing}</td><td>${canManage()?`<button class="link" data-quota="${g.id}">Bearbeiten</button>`:badge('Nur Ansicht')}</td></tr>`))}</section><div class="notice">Nicht angegebene Steh- und Sitzplatzmengen werden mit 0 angezeigt. Eine vorhandene Gesamtzuteilung bleibt erhalten; fehlende Aufteilungen sind bei der Gesamtzahl als „noch ohne Platzart“ gekennzeichnet. Kartenbeauftragte oder Admins können die konkreten Mengen eintragen.</div>`;};
const previousTicketSection=ticketSection;

 let html=previousTicketSection(g).replace('<section class="card">',`<section class="card" data-ticket-game="${g.id}">`).replace(`<h2>Interne Kartenvergabe</h2>`,`<h2>${g.day}. Spieltag · ${esc(g.opponent)} (${g.quota} ${g.quota===1?'Karte':'Karten'} zugeteilt)</h2>`);
 if(!g.tickets.length){
  const status=`${badge('Nutzung offen','gray')} ${g.kind==='Auswärts'?badge('Kontrolle offen','amber'):''}<div class="ticketstatus">${badge('Zahlung offen','red')} ${badge('Abruf offen','orange')}</div>${g.kind==='Auswärts'?'<small>Personalisierung offen</small>':''}`;
  html=html.replace('<tr><td colspan="5" class="empty">Keine Einträge vorhanden.</td></tr>',`<tr class="statuspreview"><td class="muted">—</td><td><strong>Noch keine Karte vergeben</strong><small>Statusvorschau · keine tatsächliche Kartenbuchung</small></td><td class="muted">—</td><td>${status}</td><td class="muted">—</td></tr>`);
 }
 return html;
};
tickets=function(){const all=ticketFilter==='all';const list=all?db.games:[game()];return heading('Von der Zuteilung ins Stadion','Vergabe, Abruf, Weitergabe und spätere Nutzung je Karte.')+`<div class="card pad"><label class="inline-label">Spieltag auswählen<select id="gameSelect" style="margin-top:9px"><option value="all" ${all?'selected':''}>Alle · komplette Saisonübersicht</option>${db.games.map(g=>`<option value="${g.id}" ${!all&&selected===g.id?'selected':''}>${g.day}. Spieltag · ${esc(g.opponent)} · ${g.kind} · ${g.quota} Karten</option>`).join('')}</select></label></div>`+(all?stats([['Saisonspiele',db.games.length,'Heim- und Auswärtsspiele'],['Zuteilung',sum(db.games,g=>g.quota),'Karten vom Bezirk'],['Vergebene Karten',sum(db.games,g=>g.tickets.length),'Alle Spieltage'],['Zahlungen offen',sum(db.games,g=>g.tickets.filter(t=>!t.paid).length),'Vergebene Karten ohne Zahlung']]):'')+list.map(g=>ticketSection(g)).join('');};
editDate=function(id){const g=db.games.find(g=>g.id===id);openDialog('Spieltermin bearbeiten',`<p class="full">${g.day}. Spieltag · ${esc(g.opponent)} · ${g.kind}</p>`+field('Datum','date',g.date,'date','required')+field('Anstoß (leer = offen)','time',g.time,'time'),f=>{const nextDate=dateCell(f.get('date'),'Spieltermin'),time=f.get('time');if(!nextDate)throw Error('Bitte ein Datum angeben.');if(time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('Bitte eine gültige Anstoßzeit angeben.');g.date=nextDate;g.time=time;save('Spieltermin geändert: '+g.opponent+' / '+date(g.date)+' / '+(g.time||'Anstoß offen'));});};
